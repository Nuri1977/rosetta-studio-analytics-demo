e\">\n        <Column id=\"first_name\" title=\"First Name\" />\n        <Column id=\"last_name\" title=\"Last Name\" />\n        <Column id=\"total_orders\" title=\"Total Orders\" />\n        <Column id=\"lifetime_value\" title=\"Lifetime Value\" fmt=\"usd\" />\n    </DataTable>\n</Grid>\n\n```sql top_customers\nSELECT \n    first_name,\n    last_name,\n    total_orders,\n    lifetime_value\nFROM mrt_customer_lifetime_value\nORDER BY lifetime_value DESC\nLIMIT 10\n```\n\n## Product Performance\n\n<Grid columns={2}>\n    <BarChart data={best_selling_products} x=\"product_name\" y=\"quantity_sold\" title=\"Top 10 Products by Quantity Sold\" />\n    <LineChart data={product_popularity_trend} x=\"order_month\" y=\"quantity_sold\" series=\"product_name\" title=\"Product Popularity Trend\" />\n</Grid>\n\n```sql best_selling_products\nSELECT \n    product_name,\n    count(*) as quantity_sold,\n    sum(item_price) as total_revenue\nFROM int_order_items_joined\nGROUP BY 1\nORDER BY 2 DESC\nLIMIT 10\n```\n\n```sql product_popularity_trend\nSELECT \n    strftime(date_trunc('month', o.order_date), '%Y-%m') as order_month,\n    i.product_name,\n    count(*) as quantity_sold\nFROM int_order_items_joined i\nJOIN fct_orders o ON i.order_id = o.order_id\nGROUP BY 1, 2\nORDER BY 1 ASC\n```\n\n## Operational Metrics\n\n<Grid columns={2}>\n    <DonutChart data={order_status_summary} x=\"status\" y=\"total_orders\" title=\"Order Status Summary\" />\n</Grid>\n\n```sql order_status_summary\nSELECT \n    status,\n    count(*) as total_orders\nFROM fct_orders\nGROUP BY 1\n```\n","queryResults":{"report_time":[{"current_time":"2026-09-27 03:29"}],"metrics":[{"total_revenue":3287,"total_orders":99}],"monthly_revenue":[{"order_month":"2018-01","monthly_revenue":1037},{"order_month":"2018-02","monthly_revenue":824},{"order_month":"2018-03","monthly_revenue":1164},{"order_month":"2018-04","monthly_revenue":262}],"order_stats":[{"order_month":"2018-01","total_orders":29,"total_revenue":1037},{"o
