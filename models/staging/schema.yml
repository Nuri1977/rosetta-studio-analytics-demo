version: 2

models:
  - name: int_order_items_joined
    description: "Joins order items with product information to provide a grain of line items with product details."
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: int_orders_joined
    description: "Joins orders with customer addresses to provide a grain of orders with location context."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
